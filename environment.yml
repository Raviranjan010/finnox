name: finbert
channels:
  - pytorch
  - anaconda
  - conda-forge
  - defaults
dependencies:
  - jupyter=1.0.0
  - pandas=0.23.4
  - python=3.7.3
  - numpy==1.16.3
  - nltk
  - tqdm
  - ipykernel=5.1.3
  - transformers=4.1.1
  - pip:
    - joblib==0.13.2
    - scikit-learn==0.21.2
    - torch==1.1.0
    - textblob
    - fastapi
    - uvicorn
    - celery[redis]
    - redis
    - httpx
    - spacy>=3.0.0
    - spacy-transformers
    - shap
    - numba